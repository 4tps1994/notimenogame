<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222222;
    --accent: #e8ff00;
    --accent2: #ff4444;
    --text: #f0f0f0;
    --muted: #777777;
    --choi: #00ff88;
    --de-sau: #ffaa00;
    --bo: #ff4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    padding: 48px 40px 32px;
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .avatar {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    object-fit: cover;
    background: #000;
    flex-shrink: 0;
  }


  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 6vw, 72px);
    letter-spacing: 0.05em;
    line-height: 1;
    color: var(--text);
  }

  .brand span { color: var(--accent); }

  .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* FILTER SECTIONS */
  .filter-section {
    padding: 40px 40px 0;
  }

  .filter-section + .filter-section {
    padding-top: 32px;
  }

  .filter-section:last-of-type {
    padding-bottom: 40px;
    border-bottom: 1px solid var(--border);
  }

  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .question {
    font-family: 'Oswald', 'Bebas Neue', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    font-size: clamp(20px, 2.6vw, 32px);
    letter-spacing: 0.04em;
    margin-bottom: 20px;
    line-height: 1.15;
  }

  .filter-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: #888888;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 12px 20px;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 0.05em;
    position: relative;
    overflow: hidden;
  }

  .filter-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform: translateY(100%);
    transition: transform 0.15s ease;
    z-index: 0;
  }

  .filter-btn span { position: relative; z-index: 1; }

  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--bg);
  }

  .filter-btn:hover::before { transform: translateY(0); }

  .filter-btn.active {
    border-color: var(--accent);
    color: var(--bg);
    background: var(--accent);
  }

  /* RESULTS */
  .results-section { padding: 48px 40px; }

  .results-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 32px;
  }

  .results-count {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--accent);
    line-height: 1;
  }

  .results-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 80px 40px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    display: none;
  }

  /* GAME CARDS */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
  }

  .game-card {
    background: var(--surface);
    padding: 28px;
    transition: background 0.15s ease;
    animation: slideUp 0.3s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    .game-card { animation: none; }
  }

  @keyframes slideUp {
    from { transform: translateY(8px); }
    to { transform: translateY(0); }
  }

  .game-card:hover { background: #1b1b1b; box-shadow: inset 0 0 0 1px #2a2a2a; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .card-name-group {
    flex: 1;
    padding-right: 12px;
  }

  .rec-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    border: 1px solid rgba(232,255,0,0.5);
    padding: 2px 6px;
    display: block;
    width: fit-content;
    margin-bottom: 7px;
    opacity: 0.85;
  }

  .game-name {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.3;
    color: #ffffff;
    letter-spacing: 0.01em;
    text-shadow: 0 0 12px rgba(232, 255, 0, 0.12);
    position: relative;
    display: inline;
    background: linear-gradient(
      to top,
      rgba(232, 255, 0, 0.24) 0%,
      rgba(232, 255, 0, 0.24) 38%,
      transparent 38%,
      transparent 100%
    );
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
    padding: 0 2px;
    transition: color 0.15s ease, text-shadow 0.15s ease;
  }

  .game-card:hover .game-name {
    color: var(--accent);
    text-shadow: 0 0 14px rgba(232, 255, 0, 0.22);
  }

  .verdict-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    padding: 4px 8px;
    letter-spacing: 0.05em;
    flex-shrink: 0;
    white-space: nowrap;
    text-align: center;
    line-height: 1.4;
  }

  .verdict-choi   { background: var(--choi);  color: #000; }
  .verdict-de-sau { background: var(--de-sau); color: #000; }
  .verdict-bo     { background: var(--bo);     color: #fff; }

  .game-meta {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .game-type {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #8f8f8f;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .game-series {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: rgba(232,255,0,0.5);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .game-series::before { content: '· '; }

  /* SCORE BAR */
  .score-section {
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  .score-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 7px;
  }

  .score-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #d8d8d8;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .score-copy {
    width: 116px;
    flex-shrink: 0;
  }

  .score-state {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10px;
    color: #8f8f8f;
    line-height: 1.25;
    margin-top: 2px;
  }

  .score-toggle {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: transparent;
    border: 0;
    padding: 0;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .score-toggle-text {
    color: #9a9a9a;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  .score-content { margin-top: 10px; }

  .score-section.collapsed .score-content { display: none; }

  .score-hint {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11px;
    color: #9a9a9a;
    margin-bottom: 10px;
  }

  .score-dots { display: flex; gap: 4px; }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
  }

  .dot.filled { background: var(--accent); }

  /* TOTAL SCORE */
  .total-score {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .total-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .total-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  /* BUSY SCALE */
  .busy-scale-section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  .busy-left {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .busy-label-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .busy-desc-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
  }

  .busy-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .busy-bar {
    display: flex;
    gap: 3px;
    align-items: center;
  }

  .busy-pip {
    width: 6px;
    height: 16px;
    border-radius: 2px;
    background: var(--border);
    transition: background 0.1s;
  }

  .busy-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 0.05em;
    line-height: 1;
  }

  /* NOTE */
  .game-note {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    font-weight: 300;
    color: #c6c6c6;
    line-height: 1.6;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding-left: 12px;
  }

  /* SESSION CHIP */
  .session-chip {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    line-height: 1.35;
    letter-spacing: 0.04em;
    color: var(--accent);
    background: rgba(232, 255, 0, 0.075);
    border: 1px solid rgba(232, 255, 0, 0.22);
    padding: 5px 8px;
    margin: -6px 0 14px;
  }

  /* SESSION TAG */
  .session-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    background: rgba(232,255,0,0.08);
    border: 1px solid rgba(232,255,0,0.2);
    color: var(--accent);
    margin-top: 12px;
    letter-spacing: 0.05em;
  }

  /* FOOTER */
  footer {
    padding: 40px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  footer a {
    color: var(--muted);
    text-decoration: none;
  }

  footer a:hover { color: var(--accent); }

  /* SEARCH */
  .search-section {
    padding: 0 40px 32px;
    border-bottom: 1px solid var(--border);
  }

  .search-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 22px;
    font-weight: 300;
    padding: 12px 0;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input::placeholder {
    color: #333;
  }

  .search-input:focus {
    border-bottom-color: var(--accent);
  }

  /* SORT */
  .sort-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .sort-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid #383838;
    color: #b8b8b8;
    cursor: pointer;
    transition: all 0.15s;
  }

  .sort-btn:hover { border-color: #444; color: var(--text); }
  .sort-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232,255,0,0.05); }

  @media (max-width: 600px) {
    /* Layout */
    header, .filter-section, .search-section, .results-section { padding-left: 20px; padding-right: 20px; }
    footer { padding: 32px 20px; }
    .games-grid { grid-template-columns: 1fr; }
    .game-card { animation: none; }
    .search-input::placeholder { color: #666; }
    .header-inner { gap: 16px; }
    .avatar { width: 72px; height: 72px; }

    /* Font system mobile — size cố định, không phụ thuộc clamp */
    .brand { font-size: 44px; line-height: 0.95; }
    .tagline { font-size: 10px; line-height: 1.5; letter-spacing: 0.08em; }
    .section-label { font-size: 9px; letter-spacing: 0.16em; }
    .question { font-size: 23px; line-height: 1.15; margin-bottom: 14px; }
    .filter-btn { font-size: 10px; line-height: 1.2; padding: 10px 12px; }
    .search-input { font-size: 18px; line-height: 1.4; }
    .sort-btn { font-size: 9px; line-height: 1.2; padding: 7px 9px; }
    .results-count { font-size: 40px; }
    .results-label { font-size: 10px; line-height: 1.4; }
    .game-name { font-size: 18px; font-weight: 700; line-height: 1.35; color: #ffffff; }
    .game-note { color: #d0d0d0; }
    .session-chip { font-size: 10px; line-height: 1.35; padding: 6px 9px; margin: -4px 0 12px; }
    .verdict-badge { font-size: 8px; line-height: 1.3; padding: 4px 7px; white-space: normal; max-width: 118px; }
    .game-type, .game-series { font-size: 9px; line-height: 1.4; }
    .score-row { align-items: center; gap: 10px; }
    .score-copy { width: 120px; }
    .score-label { width: auto; font-size: 9px; line-height: 1.2; }
    .score-state { font-size: 10px; color: #9a9a9a; }
    .game-card { display: flex; flex-direction: column; }
    .card-top { order: 1; }
    .game-meta { order: 2; }
    .session-chip { order: 3; }
    .game-note { order: 4; }
    .busy-scale-section { order: 5; }
    .score-section { order: 6; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .game-note { font-size: 13px; line-height: 1.55; }
    .busy-label-text { font-size: 8px; line-height: 1.3; }
    .busy-desc-text { font-size: 10px; line-height: 1.4; }
    .busy-num { font-size: 24px; }
    .rec-badge { line-height: 1.3; }
    .session-tag { line-height: 1.4; }
    .total-label { line-height: 1.4; }
    footer { font-size: 9px; line-height: 1.5; }
  }
</style>
</head>

// Build game objects
const GAMES = RAW.map(r => {
  const scores = r.slice(3, 9); // chỉ lấy 6 điểm, không lấy note
  const total = scores.reduce((a, b) => a + b, 0);
  const verdictClass = total >= 8 ? "verdict-choi" : total >= 5 ? "verdict-de-sau" : "verdict-bo";
  const verdictText  = total >= 8 ? "Rất hợp người bận" : total >= 5 ? "Cân nhắc" : "Tốn thời gian";
  const sessionMinutes = scores[4] === 2 ? 20 : scores[4] === 1 ? 60 : 180;
  const busyScale = calcBusyScale(scores);
  const busy = busyMeta(busyScale);
  const genre = getGenre(r[1], r[2]);
  const displayGenre = r[2] === "10 Pixel Indie" ? "Pixel Indie" : genre;
  return {
    name: r[0], type: r[1], series: r[2],
    scores, total, verdictClass, verdictText, sessionMinutes,
    busyScale, busy,
    genre: displayGenre,
    note: r[9] || "",
    recommended: r[10] === true
  };
});

// Busy Scale 1–10: đo mức độ "nguy hiểm với thời gian của người bận"
// Trục chính: tổng thời lượng + grind, không phải session length
function calcBusyScale(scores) {
  const [s1, s2, s3, s4, s5, s6] = scores;

  const danger =
    (2 - s1) * 3.0 +   // ① Tổng thời lượng — quan trọng nhất (max 6)
    (2 - s2) * 1.5 +   // ② Grind / lặp lại (max 3)
    (2 - s5) * 1.0 +   // ⑤ Session lock-in (max 2)
    (2 - s3) * 0.5 +   // ③ Cần tập trung (max 1)
    s6       * 0.5;    // ⑥ Độ đọng lại / kéo bạn quay lại (max 1)

  // Max possible = 13
  let scale = Math.round(danger / 13 * 9) + 1;

  // Chill trap: game nhẹ + thời lượng dài = mất giờ mà không hay biết
  if (s3 === 2 && s1 === 0) scale += 1;

  return Math.max(1, Math.min(10, scale));
}

function busyMeta(scale) {
  if (scale <= 3) return { color: '#00ff88', bg: 'rgba(0,255,136,0.08)',   label: 'Rất linh hoạt' };
  if (scale <= 6) return { color: '#ffd93d', bg: 'rgba(255,217,61,0.08)',  label: 'Khá ổn' };
  if (scale <= 8) return { color: '#ff9f1c', bg: 'rgba(255,159,28,0.08)',  label: 'Bắt đầu cuốn' };
  return           { color: '#ff4444', bg: 'rgba(255,68,68,0.08)',    label: 'Cần commit' };
}

// Genre detection from game type field
// Priority: Kinh Dị > Roguelike > Soulslike > Sinh Tồn > Chiến Thuật > Game Cảm Xúc > Simulation > Hành Động
function getGenre(type, series) {
  const t = type.toLowerCase();
  if (/kinh dị|horror/.test(t))                          return "Kinh Dị";
  if (/roguelite|roguelike/.test(t))                     return "Roguelike";
  if (/soulslike|metroidvania/.test(t))                  return "Soulslike";
  if (/sinh tồn|survival/.test(t))                       return "Sinh Tồn";
  if (/chiến thuật|strategy/.test(t))                    return "Chiến Thuật";
  if (/walking sim|narrative|interactive/.test(t))       return "Game Cảm Xúc";
  if (/farming|simulation|racing|quản lý|god game|chill/.test(t)) return "Simulation";
  return "Hành Động";
}

// Thể loại hiển thị trên card — 1 thể loại chính, tiếng Việt, ngắn
function getDisplayTypeVi(type, genre) {
  const t = String(type).toLowerCase();
  if (t.includes("kinh dị") || t.includes("horror"))       return "Kinh dị";
  if (t.includes("soulslike"))                              return "Soulslike";
  if (t.includes("metroidvania"))                           return "Metroidvania";
  if (t.includes("roguelike") || t.includes("roguelite")) {
    if (t.includes("thẻ bài") || t.includes("deck") || t.includes("poker")) return "Roguelike thẻ bài";
    return "Roguelike";
  }
  if (t.includes("deck") || t.includes("thẻ bài"))          return "Thẻ bài";
  if (t.includes("brawler"))                                return "Hành động";
  if (t.includes("walking") || t.includes("narrative") || t.includes("interactive")) return "Kể chuyện khám phá";
  if (t.includes("platformer"))                             return "Đi cảnh";
  if (t.includes("puzzle") || t.includes("giải đố"))        return "Giải đố";
  if (t.includes("sinh tồn") || t.includes("survival"))     return "Sinh tồn";
  if (t.includes("chiến thuật") || t.includes("strategy") || t.includes("tactics")) return "Chiến thuật";
  if (t.includes("farming"))                                return "Nông trại";
  if (t.includes("racing") || t.includes("đua xe"))         return "Đua xe";
  if (t.includes("quản lý") || t.includes("god game") || t.includes("simulation") || t.includes("sim")) return "Mô phỏng";
  if (t.includes("rpg") || t.includes("nhập vai"))          return "Nhập vai";
  if (t.includes("phiêu lưu") || t.includes("adventure"))   return "Phiêu lưu";
  if (t.includes("stealth") || t.includes("ẩn nấp"))        return "Hành động lén lút";
  if (t.includes("fps") || t.includes("tps") || t.includes("shooter") || t.includes("bắn súng")) return "Bắn súng";
  if (t.includes("open world") || t.includes("chill"))      return "Thế giới mở";
  if (t.includes("hành động") || t.includes("action"))      return "Hành động";
  if (t.includes("arcade"))                                 return "Arcade";
  if (genre) return genre;
  return "Game indie";
}

function normalizeText(str) {
  return String(str)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d");
}

let activeTime = 999;
let activeGenre = "all";
let activeSearch = "";
let activeSearchRaw = "";
let activeSort = "best";

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function onSearch(val) {
  activeSearchRaw = val.trim();
  activeSearch = normalizeText(val.trim());
  // Khi search, reset genre về "Tất cả" để không bị confuse
  if (activeSearch && activeGenre !== "all") {
    activeGenre = "all";
    document.querySelectorAll('#genre-filters .filter-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('#genre-filters .filter-btn[data-genre="all"]').classList.add('active');
  }
  renderGames();
}

function selectSort(btn) {
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeSort = btn.dataset.sort;
  renderGames();
}

function selectTime(btn) {
  const val = parseInt(btn.dataset.time);
  if (activeTime === val) {
    // bấm lại → bỏ filter
    btn.classList.remove('active');
    activeTime = 999;
  } else {
    document.querySelectorAll('#time-filters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTime = val;
  }
  renderGames();
}

function selectGenre(btn) {
  document.querySelectorAll('#genre-filters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeGenre = btn.dataset.genre;
  renderGames();
}

function toggleScores(btn) {
  const section = btn.closest(".score-section");
  const isCollapsed = section.classList.toggle("collapsed");
  const text = btn.querySelector(".score-toggle-text");
  text.textContent = isCollapsed ? "Xem thêm ▾" : "Thu gọn ▴";
}

function renderGames() {
  try {
  const IS_MOBILE = window.matchMedia('(max-width: 600px)').matches;
  let filtered = [...GAMES];

  if (activeTime === 30) {
    filtered = filtered.filter(g => g.sessionMinutes <= 30);
  } else if (activeTime === 60) {
    filtered = filtered.filter(g => g.sessionMinutes <= 60);
  } else if (activeTime === 180) {
    // "2 tiếng+" = game cần session dài, không dừng tự do được
    filtered = filtered.filter(g => g.sessionMinutes >= 180);
  }
  // activeTime === 999 = Tất cả, không lọc

  if (activeGenre !== "all") {
    filtered = filtered.filter(g => g.genre === activeGenre);
  }

  if (activeSearch) {
    filtered = filtered.filter(g =>
      normalizeText(g.name).includes(activeSearch) ||
      normalizeText(g.type).includes(activeSearch) ||
      normalizeText(g.series).includes(activeSearch) ||
      normalizeText(g.genre).includes(activeSearch) ||
      normalizeText(g.note).includes(activeSearch)
    );
  }


  // Sort
  if (activeSort === "best") {
    filtered.sort((a, b) => b.total - a.total || a.busyScale - b.busyScale);
  } else if (activeSort === "least-busy") {
    filtered.sort((a, b) => a.busyScale - b.busyScale || b.total - a.total);
  } else if (activeSort === "most-busy") {
    filtered.sort((a, b) => b.busyScale - a.busyScale || a.total - b.total);
  } else if (activeSort === "az") {
    filtered.sort((a, b) => a.name.localeCompare(b.name));
  }

  const grid = document.getElementById('games-grid');
  const header = document.getElementById('results-header');
  const empty = document.getElementById('empty-state');

  document.getElementById('count').textContent = filtered.length;

  const label = header.querySelector('.results-label');
  if (activeTime === 999 && activeGenre === "all" && !activeSearch) {
    label.innerHTML = "game trong<br>database";
  } else {
    label.innerHTML = "game phù hợp<br>với bộ lọc";
  }

  grid.innerHTML = '';

  if (filtered.length === 0) {
    empty.style.display = 'block';
    grid.style.display = 'none';
    const msg = document.getElementById('empty-msg');
    if (activeTime !== 999 && activeGenre !== "all") {
      msg.innerHTML = 'Không có game <strong>' + activeGenre + '</strong> nào phù hợp với bộ lọc thời gian này.<br><span style="opacity:0.6;font-size:13px">Thử bỏ bộ lọc thời gian bên trên.</span>';
    } else if (activeSearch) {
      msg.innerHTML = 'Không tìm thấy "<strong>' + escapeHtml(activeSearchRaw) + '</strong>".<br><span style="opacity:0.6;font-size:13px">Thử tên tiếng Anh hoặc kiểm tra lại chính tả.</span>';
    } else {
      msg.innerHTML = 'Không có game nào khớp. Thử đổi bộ lọc.';
    }
  } else {
    empty.style.display = 'none';
    grid.style.display = 'grid';

    filtered.forEach((game, i) => {
      const card = document.createElement('div');
      card.className = 'game-card';

      const dotsHtml = (score) => {
        let html = '';
        for (let d = 0; d < 2; d++) {
          html += '<div class="dot ' + (d < score ? 'filled' : '') + '"></div>';
        }
        return html;
      };

      const scoresHtml = SCORE_LABELS.map((lbl, idx) =>
        '<div class="score-row">' +
          '<div class="score-copy">' +
            '<div class="score-label">' + lbl + '</div>' +
            '<div class="score-state">' + getScoreState(lbl, game.scores[idx]) + '</div>' +
          '</div>' +
          '<div class="score-dots">' + dotsHtml(game.scores[idx]) + '</div>' +
        '</div>'
      ).join('');

      const pipArr = [];
      for (let j = 0; j < 10; j++) {
        const s = j < game.busyScale ? 'background:' + game.busy.color : '';
        pipArr.push('<div class="busy-pip" style="' + s + '"></div>');
      }
      const pips = pipArr.join('');

      const recBadge = game.recommended ? '<div class="rec-badge">✦ TÊ KHUYÊN</div>' : '';

      const noteHtml = game.note ? '<div class="game-note">' + game.note + '</div>' : '';

      const sessionText = SESSION_MAP[game.name] || "";
      const sessionHtml = sessionText ? '<div class="session-chip">⏱ ' + sessionText + '</div>' : '';

      card.innerHTML =
        '<div class="card-top">' +
          '<div class="card-name-group">' + recBadge +
            '<div class="game-name">' + game.name + '</div>' +
          '</div>' +
          '<div class="verdict-badge ' + game.verdictClass + '"> ' + game.verdictText + '</div>' +
        '</div>' +
        '<div class="game-meta"><span class="game-type">' + getDisplayTypeVi(game.type, game.genre) + '</span></div>' +
        sessionHtml +
        noteHtml +
        '<div class="busy-scale-section">' +
          '<div class="busy-left">' +
            '<span class="busy-label-text">Busy Scale</span>' +
            '<span class="busy-desc-text" style="color:' + game.busy.color + '">' + game.busy.label + '</span>' +
          '</div>' +
          '<div class="busy-right">' +
            '<div class="busy-bar">' + pips + '</div>' +
            '<div class="busy-num" style="color:' + game.busy.color + '">' + game.busyScale + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="score-section' + (IS_MOBILE ? ' collapsed' : '') + '">' +
          '<button class="score-toggle" type="button" onclick="toggleScores(this)">' +
            '<span>Điểm người bận</span>' +
            '<span class="score-toggle-text">' + (IS_MOBILE ? 'Xem thêm ▾' : 'Thu gọn ▴') + '</span>' +
          '</button>' +
          '<div class="score-content">' +
            '<div class="score-hint">Chấm cao = dễ hợp hơn · Dư âm = cảm xúc còn lại</div>' +
            scoresHtml +
          '</div>' +
        '</div>';

      grid.appendChild(card);
    });
  }
  } catch (e) { console.error("renderGames error:", e); }
}

// Search input — multi-event cho mobile (oninput không reliable trên Android)
const _si = document.getElementById('search-input');
['input', 'change', 'keyup', 'compositionend'].forEach(function(evt) {
  _si.addEventListener(evt, function() { onSearch(_si.value); });
});

// Render on load
renderGames();
</script>
</body>
</html>
